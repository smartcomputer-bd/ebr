<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Computer | Cloud Management System</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // আপনার দেওয়া Firebase কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyAsosjugcKHhR6-M_AurTrxIe2SV0pIBpE",
            authDomain: "smart-erp-175cf.firebaseapp.com",
            databaseURL: "https://smart-erp-175cf-default-rtdb.firebaseio.com",
            projectId: "smart-erp-175cf",
            storageBucket: "smart-erp-175cf.firebasestorage.app",
            messagingSenderId: "787232044499",
            appId: "1:787232044499:web:20c9ac6d80f92ce81c2b26",
            measurementId: "G-8VE4ZEP3JG"
        };

        // Firebase ইনিশিয়ালাইজেশন
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // গ্লোবাল ভেরিয়েবল
        window.users = [];
        window.stock = [];
        window.invoices = [];

        // ক্লাউড থেকে ডাটা লোড করা
        function loadCloudData() {
            db.ref('smart_erp/').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    window.users = data.users || [{id:'admin', pass:'smart123'}];
                    window.stock = data.stock || [];
                    window.invoices = data.invoices ? Object.values(data.invoices) : [];
                    
                    if(document.getElementById('app').classList.contains('hidden') === false) {
                        renderHistory();
                        renderStock();
                        renderUsers();
                    }
                }
            });
        }

        // ক্লাউডে ডাটা সেভ করা
        function saveToCloud(path, data) {
            db.ref('smart_erp/' + path).set(data);
        }

        loadCloudData();
    </script>

    <style>
        :root { --primary: #1e40af; --secondary: #3b82f6; --dark: #0f172a; --bg: #e2e8f0; --text: #1e293b; --success: #059669; --danger: #dc2626; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .hidden { display: none !important; }
        .navbar { background: var(--dark); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-links button { background: #334155; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 6px; margin-left: 5px; transition: 0.3s; }
        .nav-links button:hover { background: var(--primary); }
        .invoice-sheet { width: 210mm; min-height: 297mm; background: white; padding: 15mm; margin: 20px auto; position: relative; color: #000; box-sizing: border-box; border: 1px solid #d1d5db; }
        .header h1 { margin: 0; font-size: 42px; color: var(--primary); font-weight: 900; }
        .slogan { font-size: 14px; color: #444; font-weight: 600; font-style: italic; margin-top: -5px; margin-bottom: 10px; }
        .cust-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border: 1px solid #e2e8f0; }
        .pass-container { position: relative; width: 90%; margin: 10px auto; }
        .toggle-password { position: absolute; right: 10px; top: 12px; cursor: pointer; color: #666; }
        @media print { .no-print { display: none !important; } .invoice-sheet { border: none; margin: 0; } }
    </style>
</head>
<body onload="document.getElementById('uId').focus()">

<div id="loginPage" style="position:fixed; inset:0; background:var(--dark); display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="background:white; padding:40px; border-radius:15px; width:350px; text-align:center;">
        <h2 style="color:var(--primary)">Smart Computer ERP</h2>
        <input type="text" id="uId" placeholder="User ID" style="width:90%; padding:12px; margin:10px 0;">
        <div class="pass-container">
            <input type="password" id="uPass" placeholder="Password" style="width:100%; padding:12px;" onkeypress="if(event.key === 'Enter') login()">
            <i class="fa-solid fa-eye toggle-password" onclick="togglePass()"></i>
        </div>
        <button onclick="login()" class="nav-links" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer;">LOGIN</button>
    </div>
</div>

<div id="app" class="hidden">
    <nav class="navbar no-print">
        <div style="font-size:20px; font-weight:bold;">SMART COMPUTER</div>
        <div class="nav-links">
            <button onclick="showSec('pos')">Invoice</button>
            <button onclick="showSec('history')">History</button>
            <button onclick="showSec('stock')">Inventory</button>
            <button onclick="location.reload()">Logout</button>
        </div>
    </nav>

    <div id="posSec">
        <div class="invoice-sheet" id="invoice">
            <div class="header">
                <div>
                    <h1>SMART COMPUTER</h1>
                    <div class="slogan">Quality Service, Smart Solution</div>
                    <p>Khalishpur, Khulna | 01614-398989</p>
                </div>
                <div style="text-align:right">
                    <p><b>No:</b> <span id="invId"></span></p>
                    <p><b>Date:</b> <span id="curDate"></span></p>
                </div>
            </div>
            <div class="cust-box">
                <div class="field"><b>Customer Name:</b> <input type="text" id="cName" style="flex:1"></div>
                <div class="field"><b>Mobile:</b> <input type="text" id="cPhone" style="flex:1"></div>
            </div>
            <table border="1" style="width:100%; border-collapse: collapse;">
                <thead><tr><th>SL</th><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
                <tbody id="billBody"></tbody>
            </table>
            <div style="display:flex; justify-content:space-between; margin-top:20px;">
                <div id="qrcode"></div>
                <div style="text-align:right">
                    <p><b>Grand Total: <span id="grandT">0</span></b></p>
                </div>
            </div>
        </div>
        <div class="no-print" style="text-align:center; margin-bottom: 20px;">
            <button onclick="saveAndPrint()" style="padding:15px 30px; background:var(--success); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">Save & Print</button>
        </div>
    </div>
    
    <div id="historySec" class="hidden" style="padding:20px;">
        <h3>Sales History</h3>
        <table border="1" style="width:100%; border-collapse: collapse; background:white;">
            <thead><tr><th>Date</th><th>ID</th><th>Customer</th><th>Total</th></tr></thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <div id="stockSec" class="hidden" style="padding:20px;">
        <h3>Inventory</h3>
        <input type="text" id="sCode" placeholder="Code">
        <input type="text" id="sName" placeholder="Name">
        <input type="number" id="sPrice" placeholder="Price">
        <button onclick="addStock()">Add Item</button>
        <table border="1" style="width:100%; border-collapse: collapse; background:white; margin-top:10px;">
            <tbody id="stockBody"></tbody>
        </table>
    </div>
</div>

<script>
    function togglePass() {
        const p = document.getElementById('uPass');
        p.type = p.type === "password" ? "text" : "password";
    }

    function login() {
        const id = document.getElementById('uId').value;
        const pass = document.getElementById('uPass').value;
        const u = window.users.find(x => x.id === id && x.pass === pass);
        if(u) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            resetPOS();
        } else alert("Access Denied!");
    }

    function resetPOS() {
        document.getElementById('invId').innerText = "Inv-" + Date.now().toString().slice(-6);
        document.getElementById('curDate').innerText = new Date().toLocaleDateString();
        let rows = "";
        for(let i=1; i<=10; i++) {
            rows += `<tr><td>${i}</td><td><input type="text" class="it-n" style="width:95%"></td><td><input type="number" class="it-q" value="0" oninput="calc()"></td><td><input type="number" class="it-p" value="0" oninput="calc()"></td><td class="it-t">0</td></tr>`;
        }
        document.getElementById('billBody').innerHTML = rows;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: "Smart-Computer", width: 80, height: 80 });
    }

    function calc() {
        let grand = 0;
        document.querySelectorAll('#billBody tr').forEach(r => {
            const q = parseFloat(r.querySelector('.it-q').value) || 0;
            const p = parseFloat(r.querySelector('.it-p').value) || 0;
            const t = q * p;
            r.querySelector('.it-t').innerText = t;
            grand += t;
        });
        document.getElementById('grandT').innerText = grand;
    }

    function saveAndPrint() {
        const inv = {
            id: document.getElementById('invId').innerText,
            date: document.getElementById('curDate').innerText,
            customer: document.getElementById('cName').value,
            grand: document.getElementById('grandT').innerText
        };
        db.ref('smart_erp/invoices/' + inv.id).set(inv);
        window.print();
    }

    function renderHistory() {
        let h = "";
        window.invoices.forEach(x => {
            h += `<tr><td>${x.date}</td><td>${x.id}</td><td>${x.customer}</td><td>${x.grand}</td></tr>`;
        });
        document.getElementById('historyBody').innerHTML = h;
    }

    function addStock() {
        const item = { code: document.getElementById('sCode').value, name: document.getElementById('sName').value, price: document.getElementById('sPrice').value };
        window.stock.push(item);
        saveToCloud('stock', window.stock);
    }

    function renderStock() {
        let h = "";
        window.stock.forEach(x => { h += `<tr><td>${x.code}</td><td>${x.name}</td><td>${x.price}</td></tr>`; });
        document.getElementById('stockBody').innerHTML = h;
    }

    function showSec(id) {
        ['posSec','historySec','stockSec'].forEach(s => document.getElementById(s).classList.add('hidden'));
        document.getElementById(id + 'Sec').classList.remove('hidden');
    }
</script>
</body>
</html>
