<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Computer | Cloud ERP System</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // আপনার দেওয়া Firebase কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyAsosjugcKHhR6-M_AurTrxIe2SV0pIBpE",
            authDomain: "smart-erp-175cf.firebaseapp.com",
            databaseURL: "https://smart-erp-175cf-default-rtdb.firebaseio.com",
            projectId: "smart-erp-175cf",
            storageBucket: "smart-erp-175cf.firebasestorage.app",
            messagingSenderId: "787232044499",
            appId: "1:787232044499:web:20c9ac6d80f92ce81c2b26",
            measurementId: "G-8VE4ZEP3JG"
        };

        // Firebase ইনিশিয়ালাইজেশন
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // গ্লোবাল ভেরিয়েবল
        window.users = [];
        window.stock = [];
        window.invoices = [];
        let currentUser = "";
        let isEditMode = false;

        // ক্লাউড থেকে ডাটা লোড করা
        function loadCloudData() {
            db.ref('smart_erp/').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    window.users = data.users || [{id:'admin', pass:'smart123'}];
                    window.stock = data.stock || [];
                    window.invoices = data.invoices ? Object.values(data.invoices) : [];
                    
                    // ডাটা রেন্ডার করা (যদি লগইন করা থাকে)
                    if(!document.getElementById('app').classList.contains('hidden')) {
                        if(typeof renderHistory === "function") renderHistory();
                        if(typeof renderStock === "function") renderStock();
                        if(typeof renderUsers === "function") renderUsers();
                    }
                } else {
                    // ডাটাবেস একদম খালি থাকলে ডিফল্ট ইউজার সেট করা
                    window.users = [{id:'admin', pass:'smart123'}];
                }
            });
        }

        loadCloudData();

        // লগইন ফাংশন (সংশোধিত)
        function login() {
            const id = document.getElementById('uId').value.trim();
            const pass = document.getElementById('uPass').value.trim();
            
            // যদি ডাটাবেস থেকে ইউজার লিস্ট লোড না হয়, তবে ডিফল্ট ইউজার ব্যবহার করবে
            const activeUsers = (window.users && window.users.length > 0) ? window.users : [{id:'admin', pass:'smart123'}];
            const u = activeUsers.find(x => x.id === id && x.pass === pass);
            
            if(u) {
                currentUser = id;
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('soldBy').innerText = currentUser;
                resetPOS();
            } else {
                alert("Access Denied! ভুল আইডি বা পাসওয়ার্ড।");
            }
        }
    </script>

    <style>
        :root { --primary: #1e40af; --secondary: #3b82f6; --dark: #0f172a; --bg: #e2e8f0; --text: #1e293b; --success: #059669; --danger: #dc2626; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .hidden { display: none !important; }
        .navbar { background: var(--dark); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-links button { background: #334155; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 6px; margin-left: 5px; transition: 0.3s; font-weight: 600; }
        .nav-links button:hover { background: var(--primary); }
        .invoice-sheet { width: 210mm; min-height: 297mm; background: white; padding: 15mm; margin: 20px auto; color: #000; box-sizing: border-box; border: 1px solid #d1d5db; position: relative; }
        .header h1 { margin: 0; font-size: 38px; color: var(--primary); font-weight: 800; }
        .cust-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; background: #f8fafc; padding: 15px; border: 1px solid #e2e8f0; }
        input { border: 1px solid #ccc; padding: 6px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f1f5f9; border: 1px solid #000; padding: 10px; }
        td { border: 1px solid #000; padding: 8px; text-align: center; }
        .no-print-btn { background: var(--success); color: white; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 10px; }
        @media print { .no-print, .navbar { display: none !important; } .invoice-sheet { border: none; margin: 0; width: 100%; } }
    </style>
</head>
<body onload="document.getElementById('uId').focus()">

<div id="loginPage" style="position:fixed; inset:0; background:var(--dark); display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="background:white; padding:40px; border-radius:15px; width:350px; text-align:center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <h2 style="color:var(--primary); margin-bottom: 20px;">Smart Computer ERP</h2>
        <input type="text" id="uId" placeholder="User ID" style="width:90%; padding:12px; margin-bottom:15px; display: block; margin-left: auto; margin-right: auto;">
        <input type="password" id="uPass" placeholder="Password" style="width:90%; padding:12px; margin-bottom:20px; display: block; margin-left: auto; margin-right: auto;" onkeypress="if(event.key === 'Enter') login()">
        <button onclick="login()" style="width:95%; padding:12px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">LOGIN</button>
        <p style="font-size: 12px; color: #666; margin-top: 15px;">Default: admin | smart123</p>
    </div>
</div>

<div id="app" class="hidden">
    <nav class="navbar no-print">
        <div style="font-size:20px; font-weight:bold;"><i class="fa-solid fa-laptop-code"></i> SMART COMPUTER</div>
        <div class="nav-links">
            <button onclick="showSec('pos')">Invoice</button>
            <button onclick="showSec('history')">History</button>
            <button onclick="showSec('stock')">Inventory</button>
            <button onclick="location.reload()" style="background:var(--danger)">Logout</button>
        </div>
    </nav>

    <div id="posSec">
        <div style="text-align: center;" class="no-print">
            <button onclick="saveAndPrint()" class="no-print-btn"><i class="fa-solid fa-print"></i> Save & Print</button>
            <button onclick="resetPOS()" class="no-print-btn" style="background: var(--secondary);"><i class="fa-solid fa-plus"></i> New Invoice</button>
        </div>

        <div class="invoice-sheet" id="invoice">
            <div style="display: flex; justify-content: space-between; border-bottom: 3px solid var(--primary); padding-bottom: 10px;">
                <div>
                    <h1>SMART COMPUTER</h1>
                    <p style="margin: 5px 0; font-size: 14px;">Khalishpur, Khulna | 01614-398989</p>
                    <p style="margin: 0; font-size: 13px;">smartcomputer-bd.github.io/com</p>
                </div>
                <div style="text-align: right;">
                    <h2 style="margin: 0; color: var(--primary);">INVOICE</h2>
                    <p><b>No:</b> <span id="invId" style="color: var(--danger);"></span></p>
                    <p><b>Date:</b> <span id="curDate"></span></p>
                </div>
            </div>

            <div class="cust-box">
                <div><b>Customer:</b> <input type="text" id="cName" style="width: 70%;"></div>
                <div><b>Mobile:</b> <input type="text" id="cPhone" style="width: 70%;"></div>
            </div>

            <table>
                <thead>
                    <tr><th width="5%">SL</th><th>Description</th><th width="10%">Qty</th><th width="15%">Price</th><th width="15%">Total</th></tr>
                </thead>
                <tbody id="billBody"></tbody>
            </table>

            <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                <div id="qrcode"></div>
                <div style="text-align: right; width: 250px;">
                    <p style="font-size: 18px; border-top: 2px solid #000; padding-top: 10px;"><b>Grand Total: <span id="grandT">0.00</span></b></p>
                    <p style="font-size: 12px; font-style: italic;">Sold By: <span id="soldBy"></span></p>
                </div>
            </div>
        </div>
    </div>

    <div id="historySec" class="hidden" style="padding: 30px;">
        <h3>Sales History (Cloud Sync)</h3>
        <div id="historyList">লোড হচ্ছে...</div>
    </div>
</div>

<script>
    function resetPOS() {
        document.getElementById('invId').innerText = "INV-" + Date.now().toString().slice(-6);
        document.getElementById('curDate').innerText = new Date().toLocaleDateString();
        let rows = "";
        for(let i=1; i<=10; i++) {
            rows += `<tr><td>${i}</td><td><input type="text" style="width:95%"></td><td><input type="number" class="it-q" value="0" oninput="calc()"></td><td><input type="number" class="it-p" value="0" oninput="calc()"></td><td class="it-t">0.00</td></tr>`;
        }
        document.getElementById('billBody').innerHTML = rows;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: "SmartComputer", width: 70, height: 70 });
        document.getElementById('grandT').innerText = "0.00";
    }

    function calc() {
        let grand = 0;
        document.querySelectorAll('#billBody tr').forEach(r => {
            const q = parseFloat(r.querySelector('.it-q').value) || 0;
            const p = parseFloat(r.querySelector('.it-p').value) || 0;
            const t = q * p;
            r.querySelector('.it-t').innerText = t.toFixed(2);
            grand += t;
        });
        document.getElementById('grandT').innerText = grand.toFixed(2);
    }

    function saveAndPrint() {
        const inv = {
            id: document.getElementById('invId').innerText,
            date: document.getElementById('curDate').innerText,
            customer: document.getElementById('cName').value,
            grand: document.getElementById('grandT').innerText,
            soldBy: currentUser
        };
        // সরাসরি Firebase-এ সেভ
        db.ref('smart_erp/invoices/' + inv.id).set(inv).then(() => {
            window.print();
        });
    }

    function showSec(id) {
        document.getElementById('posSec').classList.add('hidden');
        document.getElementById('historySec').classList.add('hidden');
        document.getElementById(id + 'Sec').classList.remove('hidden');
        if(id === 'history') renderHistory();
    }

    function renderHistory() {
        let h = "<table border='1' style='width:100%; border-collapse: collapse;'><thead><tr><th>Date</th><th>ID</th><th>Customer</th><th>Total</th></tr></thead><tbody>";
        window.invoices.forEach(x => {
            h += `<tr><td>${x.date}</td><td>${x.id}</td><td>${x.customer}</td><td>${x.grand}</td></tr>`;
        });
        h += "</tbody></table>";
        document.getElementById('historyList').innerHTML = h;
    }
</script>
</body>
</html>
