<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Computer | Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #1e40af; --secondary: #3b82f6; --dark: #0f172a; --bg: #e2e8f0; --text: #1e293b; --success: #059669; --danger: #dc2626; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .hidden { display: none !important; }

        .navbar { background: var(--dark); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-links button { background: #334155; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 6px; margin-left: 5px; transition: 0.3s; }
        .nav-links button:hover { background: var(--primary); }

        .external-actions { position: fixed; top: 80px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 500; }
        
        .invoice-sheet { width: 210mm; min-height: 297mm; background: white; padding: 10mm; margin: 10px auto; position: relative; color: #000; box-sizing: border-box; display: flex; flex-direction: column; border: 1px solid #d1d5db; }
        
        .header { display: flex; justify-content: space-between; border-bottom: 4px solid var(--primary); padding-bottom: 10px; margin-bottom: 10px; }
        .header h1 { margin: 0; font-size: 36px; color: var(--primary); font-weight: 900; }
        .slogan { font-size: 13px; color: #444; font-weight: 600; font-style: italic; margin-top: -5px; margin-bottom: 5px; }
        
        .header-info p { margin: 2px 0; font-size: 12px; display: flex; align-items: center; gap: 8px; }

        .cust-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 5px; border: 1px solid #e2e8f0; }
        .field { font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .field b { min-width: 100px; color: var(--primary); }
        input { border: 1px solid #ccc; padding: 4px; border-radius: 3px; font-size: 12px; outline: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th { background: #e2e8f0; color: #000; padding: 6px; border: 1px solid #000; font-size: 11px; text-transform: uppercase; }
        td { border: 1px solid #000; padding: 3px; text-align: center; }

        #qrcode { margin-top: 10px; display: inline-block; padding: 3px; border: 1px solid #000; border-radius: 4px; }

        .footer-icons { display: flex; justify-content: center; gap: 15px; margin-top: auto; padding: 10px 0; border-top: 2px solid var(--primary); }
        .icon-box { text-align: center; width: 55px; color: var(--primary); }
        .icon-box i { font-size: 16px; }
        .icon-box span { display: block; font-size: 8px; font-weight: bold; color: #334155; margin-top: 3px; text-transform: uppercase; }

        /* --- New Seal and Signature Styles --- */
        /* লাল বৃত্তের অবস্থান অনুযায়ী ১ বর্গ ইঞ্চি সীল */
        .seal-fixed { position: absolute; bottom: 85px; left: 15%; width: 1in; height: 1in; object-fit: contain; }
        
        /* সবুজ আয়তকার অবস্থান অনুযায়ী আয়তাকার স্বাক্ষর (১" x ০.৫") */
        .sig-fixed { width: 1in; height: 0.5in; object-fit: contain; display: block; margin: 0 auto -5px auto; }

        @media print {
            @page { size: A4; margin: 0; }
            .no-print, .external-actions, .navbar { display: none !important; }
            body { background: white; }
            .invoice-sheet { box-shadow: none; margin: 0; width: 210mm; height: 297mm; border: none; padding: 10mm; }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="invoice-sheet" id="invoice">
        <div class="header">
            <div>
                <h1>SMART COMPUTER</h1>
                <div class="slogan">Quality Service, Smart Solution, Your Digital Service Partner.</div>
                <div class="header-info">
                    <p><i class="fa-solid fa-phone"></i> 01614-398989</p>
                    <p><i class="fa-solid fa-location-dot"></i> Khalishpur, Khulna</p>
                </div>
            </div>
            <div style="text-align:right">
                <p><b>Date:</b> <span id="curDate">18/03/2026</span></p>
            </div>
        </div>

        <table>
            <thead>
                <tr><th>SL</th><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr>
            </thead>
            <tbody id="billBody">
                <tr><td>1</td><td>Service Maintenance</td><td>1</td><td>500.00</td><td>500.00</td></tr>
            </tbody>
        </table>

        <img src="https://via.placeholder.com/96x96/FFFFFF/FF0000?text=SEAL" class="seal-fixed" alt="Seal">

        <div class="footer-icons">
            <div class="icon-box"><i class="fa-solid fa-desktop"></i><span>Desktop</span></div>
            <div class="icon-box"><i class="fa-solid fa-laptop"></i><span>Laptop</span></div>
            <div class="icon-box"><i class="fa-solid fa-print"></i><span>Printer</span></div>
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:10px; border-top:1px solid #eee; padding-top:8px;">
            <div style="border-top:1.5px solid #000; width:140px; text-align:center; font-size:11px; font-weight:bold;">Customer Signature</div>
            
            <div style="width:140px; text-align:center;">
                <img src="https://via.placeholder.com/96x48/FFFFFF/000000?text=SIG" class="sig-fixed" alt="Signature">
                <div style="border-top:1.5px solid #000; font-size:11px; font-weight:bold;">Authorized Sign</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
