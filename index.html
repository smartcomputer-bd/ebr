<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Computer | Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAsosjugcKHhR6-M_AurTrxIe2SV0pIBpE",
            authDomain: "smart-erp-175cf.firebaseapp.com",
            databaseURL: "https://smart-erp-175cf-default-rtdb.firebaseio.com",
            projectId: "smart-erp-175cf",
            storageBucket: "smart-erp-175cf.firebasestorage.app",
            messagingSenderId: "787232044499",
            appId: "1:787232044499:web:20c9ac6d80f92ce81c2b26",
            measurementId: "G-8VE4ZEP3JG"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Global Variables
        window.users = [];
        window.stock = [];
        window.invoices = [];

        // Load Data from Firebase (Replacement for localStorage loading)
        function loadFromFirebase() {
            db.ref('smart_erp/').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    window.users = data.users || [{id:'admin', pass:'smart123'}];
                    window.stock = data.stock || [];
                    window.invoices = data.invoices ? Object.values(data.invoices) : [];
                    
                    // Trigger UI updates if logged in
                    if(!document.getElementById('app').classList.contains('hidden')) {
                        if(typeof renderHistory === 'function') renderHistory();
                        if(typeof renderStock === 'function') renderStock();
                        if(typeof renderUsers === 'function') renderUsers();
                    }
                } else {
                    window.users = [{id:'admin', pass:'smart123'}];
                }
            });
        }

        loadFromFirebase();

        // Function to Sync Data to Cloud
        function syncCloud(path, data) {
            db.ref('smart_erp/' + path).set(data);
        }
    </script>

    <style>
        :root { --primary: #1e40af; --secondary: #3b82f6; --dark: #0f172a; --bg: #e2e8f0; --text: #1e293b; --success: #059669; --danger: #dc2626; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .hidden { display: none !important; }
        /* ... বাকি সব CSS আপনার ফাইল থেকে আসবে ... */
        .navbar { background: var(--dark); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-links button { background: #334155; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 6px; margin-left: 5px; transition: 0.3s; }
        .nav-links button:hover { background: var(--primary); }
    </style>
</head>
<body onload="document.getElementById('uId').focus()">

<script>
    // আপনার মূল জাভাস্ক্রিপ্ট ফাংশনগুলোতে শুধুমাত্র Firebase সেভিং যুক্ত করা হয়েছে

    function login() {
        const id = document.getElementById('uId').value.trim();
        const pass = document.getElementById('uPass').value.trim();
        
        // Firebase থেকে আসা ইউজার লিস্ট চেক করা
        const activeUsers = (window.users.length > 0) ? window.users : [{id:'admin', pass:'smart123'}];
        const u = activeUsers.find(x => x.id === id && x.pass === pass);
        
        if(u) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            resetPOS();
        } else {
            alert("Access Denied!");
        }
    }

    // ইনভয়েস সেভ করার সময় Firebase এ পুশ করা
    function saveInvoice(inv) {
        db.ref('smart_erp/invoices/' + inv.id).set(inv);
    }

    // স্টক বা ইউজার পরিবর্তনের সময় Firebase এ আপডেট করা
    // উদাহরণ: syncCloud('stock', window.stock);
    // উদাহরণ: syncCloud('users', window.users);

    /* আপনার ফাইলের বাকি সব ফাংশন (calc, resetPOS, renderHistory, ইত্যাদি) 
       একদম আগের মতোই থাকবে */
</script>
</body>
</html>
