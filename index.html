<div class="external-actions no-print">
    <button onclick="saveAndPrint()" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save & Print</button>
    <button onclick="printNoSave()" class="btn btn-secondary"><i class="fa-solid fa-print"></i> Print (No Save)</button>
    <button onclick="shareInvoice()" class="btn btn-secondary" style="background: #8b5cf6;"><i class="fa-solid fa-share-nodes"></i> Share</button> 
    <button onclick="resetPOS()" class="btn btn-success"><i class="fa-solid fa-file-circle-plus"></i> New Record</button>
    <button onclick="toggleDarkMode()" class="btn btn-dark" style="background: #334155; color: white;"><i class="fa-solid fa-moon"></i> Dark Mode</button>
</div>

<script>
    // আপনার পূর্বের সকল ফাংশন এখানে বিদ্যমান থাকবে...

    function shareInvoice() {
        const invId = document.getElementById('invId').innerText;
        const cName = document.getElementById('cName').value || "Customer";
        const grand = document.getElementById('grandT').innerText;
        const due = document.getElementById('pDue').innerText;
        const date = document.getElementById('curDate').innerText;
        const phone = document.getElementById('cPhone').value;

        // শেয়ার করার জন্য টেক্সট ফরম্যাট
        const shareText = `*SMART COMPUTER - Invoice*\n\n` +
                          `Invoice No: ${invId}\n` +
                          `Date: ${date}\n` +
                          `Customer: ${cName}\n` +
                          `Total Amount: TK ${grand}\n` +
                          `Due Amount: TK ${due}\n\n` +
                          `Thank you for being with us!`;

        if (navigator.share) {
            // মোবাইল বা সাপোর্টেড ব্রাউজারে সিস্টেম শেয়ার অপশন ওপেন হবে
            navigator.share({
                title: 'Smart Computer Invoice',
                text: shareText,
            }).catch(console.error);
        } else {
            // যদি ব্রাউজারে শেয়ার অপশন সাপোর্ট না করে তবে সরাসরি হোয়াটসঅ্যাপে মেসেজ যাবে
            const waUrl = `https://wa.me/88${phone}?text=${encodeURIComponent(shareText)}`;
            window.open(waUrl, '_blank');
        }
    }
</script>
