<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Computer | Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        /* index.html Original Styles (Unchanged) */
        :root { --primary: #1e40af; --secondary: #3b82f6; --dark: #0f172a; --bg: #e2e8f0; --text: #1e293b; --success: #059669; --danger: #dc2626; --card-bg: white; }
        body.dark-mode { --bg: #0f172a; --text: #f8fafc; --card-bg: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .sidebar-nav { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: var(--dark); color: white; padding: 20px; z-index: 100; }
        .main-container { margin-left: 240px; padding: 20px; }
        .nav-btn { display: block; width: 100%; padding: 12px; margin-bottom: 8px; border: none; background: transparent; color: #94a3b8; text-align: left; cursor: pointer; border-radius: 6px; font-size: 15px; }
        .nav-btn.active { background: var(--primary); color: white; }
        .panel { background: var(--card-bg); padding: 25px; border-radius: 12px; display: none; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .panel.active { display: block; }
        
        /* Smart Ledger Integration Styles (Added) */
        #smartLedgerWrapper { display: flex; min-height: 85vh; background: #fdfaf5; border-radius: 15px; overflow: hidden; color: #333; }
        .l-sidebar { width: 200px; background: linear-gradient(135deg, #2c3e50, #4ca1af); color: white; padding: 15px; }
        .l-btn { width: 100%; background: transparent; border: none; color: rgba(255,255,255,0.8); padding: 12px; text-align: left; cursor: pointer; border-radius: 8px; display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .l-btn.active { background: #e67e22; color: white; }
        .l-content { flex: 1; padding: 25px; overflow-y: auto; }
        .l-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .l-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .l-table th { border-bottom: 2px solid #e67e22; padding: 12px; text-align: left; }
        .l-table td { padding: 12px; background: #fafafa; }
        .action-icon { cursor: pointer; padding: 6px; border-radius: 50%; transition: 0.3s; display: inline-flex; vertical-align: middle; }
        .icon-wa { color: #25D366; background: rgba(37, 211, 102, 0.1); }
        .icon-print { color: #9b59b6; background: rgba(155, 89, 182, 0.1); }
        .l-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 2000; }
        .l-modal-content { background: white; padding: 30px; width: 90%; max-width: 600px; border-radius: 15px; max-height: 80vh; overflow-y: auto; }
        #l-suggestions { position: absolute; background: white; border: 1px solid #ddd; width: 100%; z-index: 10; display: none; }
        #l-suggestions div { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="sidebar-nav no-print">
    <h2 style="font-size: 18px; margin-bottom: 30px;">Smart Computer</h2>
    <button class="nav-btn active" onclick="switchMainTab('posTab', this)"><i class="fa fa-shopping-cart"></i> POS System</button>
    <button class="nav-btn" onclick="switchMainTab('inventoryTab', this)"><i class="fa fa-boxes"></i> Inventory</button>
    <button class="nav-btn" onclick="switchMainTab('historyTab', this)"><i class="fa fa-history"></i> History</button>
    <button class="nav-btn" onclick="switchMainTab('smartLedgerTab', this)" style="color: #fbbf24;"><i class="fa fa-book"></i> Smart Ledger</button>
</div>

<div class="main-container">
    <div id="posTab" class="panel active">
        <h3>POS System</h3>
        </div>

    <div id="inventoryTab" class="panel">
        <h3>Inventory Management</h3>
        </div>

    <div id="smartLedgerTab" class="panel">
        <div id="smartLedgerWrapper">
            <div class="l-sidebar">
                <h3 style="text-align:center; font-size: 16px;">Ledger Menu</h3>
                <button class="l-btn active" onclick="showLSubTab('L-Dash', this)"><i class="material-icons">dashboard</i> Dashboard</button>
                <button class="l-btn" onclick="showLSubTab('L-Book', this)"><i class="material-icons">account_balance</i> Ledger</button>
                <button class="l-btn" onclick="showLSubTab('L-Cust', this)"><i class="material-icons">people</i> Customers</button>
            </div>
            <div class="l-content">
                <div id="L-Dash" class="l-sub-tab">
                    <div style="background: linear-gradient(135deg, #2c3e50, #4ca1af); color: white; padding: 25px; border-radius: 12px; text-align: center;">
                        <span style="font-size: 16px;">মোট বাকি</span>
                        <h2 style="margin: 5px 0;">৳ <span id="l-totalDue">0</span></h2>
                    </div>
                    <div class="l-card" style="margin-top: 20px;">
                        <input type="text" id="l-dashSearch" onkeyup="updateLedgerDash()" placeholder="নাম বা মোবাইল দিয়ে সার্চ..." style="width:100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                        <table class="l-table">
                            <thead><tr><th>নাম</th><th>বাকি</th><th>অ্যাকশন</th></tr></thead>
                            <tbody id="l-dashTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="L-Book" class="l-sub-tab" style="display:none;">
                    <div class="l-card">
                        <div style="display:flex; justify-content:space-between; align-items:center">
                            <h3>হিসাব তালিকা</h3>
                            <button onclick="openQuickEntry()" style="background:#e67e22; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">+ Add New</button>
                        </div>
                        <table class="l-table">
                            <thead><tr><th>নাম</th><th>বাকি</th><th>অ্যাকশন</th></tr></thead>
                            <tbody id="l-bookTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="L-Cust" class="l-sub-tab" style="display:none;">
                    <div class="l-card">
                        <h3>কাস্টমার তালিকা</h3>
                        <table class="l-table">
                            <thead><tr><th>নাম</th><th>মোবাইল</th><th>অ্যাকশন</th></tr></thead>
                            <tbody id="l-custTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="l-modal" class="l-modal">
    <div class="l-modal-content" id="l-modal-body"></div>
</div>

<script>
    // Main Tab Switching Logic (Without changing previous code)
    function switchMainTab(tabId, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        if(tabId === 'smartLedgerTab') updateLedgerDash();
    }

    // --- Smart Ledger Integrated JavaScript ---
    let l_customers = JSON.parse(localStorage.getItem('customers')) || [];
    let l_transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    function showLSubTab(id, btn) {
        document.querySelectorAll('.l-sub-tab').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        btn.classList.add('active');
        if(id === 'L-Book') loadLBook();
        if(id === 'L-Cust') loadLCustList();
    }

    function calculateLDue(phone) {
        let ut = l_transactions.filter(t => t.phone === phone);
        let bill = ut.reduce((s, t) => s + Number(t.bill || 0), 0);
        let paid = ut.reduce((s, t) => s + Number(t.paid || 0), 0);
        return { balance: bill - paid };
    }

    function updateLedgerDash() {
        let total = 0;
        const q = document.getElementById('l-dashSearch').value.toLowerCase();
        const tbody = document.getElementById('l-dashTableBody');
        tbody.innerHTML = '';
        l_customers.forEach(c => {
            const d = calculateLDue(c.phone);
            if(d.balance > 0 && (c.name.toLowerCase().includes(q) || c.phone.includes(q))) {
                total += d.balance;
                tbody.innerHTML += `<tr>
                    <td onclick="openLDetails('${c.phone}')" style="cursor:pointer; font-weight:bold; color:#e67e22">${c.name}</td>
                    <td>৳ ${d.balance}</td>
                    <td>
                        <span class="action-icon icon-wa" onclick="sendLWA('${c.phone}')"><i class="material-icons">chat</i></span>
                        <span class="action-icon icon-print" onclick="printLInvoice('${c.phone}')"><i class="material-icons">print</i></span>
                    </td>
                </tr>`;
            }
        });
        document.getElementById('l-totalDue').innerText = total;
    }

    function loadLBook() {
        const tbody = document.getElementById('l-bookTableBody');
        tbody.innerHTML = '';
        let phones = [...new Set(l_transactions.map(t => t.phone))];
        phones.forEach(p => {
            const c = l_customers.find(x => x.phone === p) || {name: 'Unknown', phone: p};
            const d = calculateLDue(p);
            tbody.innerHTML += `<tr>
                <td onclick="openLDetails('${p}')" style="cursor:pointer; color:#e67e22">${c.name}</td>
                <td>৳ ${d.balance}</td>
                <td><span class="action-icon icon-print" onclick="printLInvoice('${p}')"><i class="material-icons">print</i></span></td>
            </tr>`;
        });
    }

    function openLDetails(phone) {
        const cust = l_customers.find(c => c.phone === phone) || {name: 'Unknown', phone: phone};
        const d = calculateLDue(phone);
        const ut = l_transactions.filter(t => t.phone === phone).reverse();
        
        let history = ut.map(t => `
            <div style="border-bottom:1px solid #eee; padding:8px; display:flex; justify-content:space-between">
                <span><b>${t.date}</b>: ${t.desc}</span>
                <span> বিল: ${t.bill} | জমা: ${t.paid}</span>
            </div>
        `).join('');

        document.getElementById('l-modal-body').innerHTML = `
            <h3>${cust.name} - বিস্তারিত</h3>
            <div style="background:#f9f9f9; padding:15px; border-radius:10px; margin-bottom:15px">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                    <input type="text" id="ntDesc" placeholder="বিবরণ">
                    <input type="number" id="ntBill" placeholder="বাকি/বিল">
                    <input type="number" id="ntPaid" placeholder="জমা">
                    <button onclick="saveLTrans('${phone}')" style="background:#2c3e50; color:white; border:none; padding:10px; border-radius:5px; grid-column:span 2">আপডেট</button>
                </div>
            </div>
            <h4>লেনদেনের ইতিহাস (বর্তমান বাকি: ৳${d.balance})</h4>
            <div style="max-height:200px; overflow-y:auto">${history}</div>
            <button onclick="closeLModal()" style="width:100%; margin-top:15px; padding:10px">বন্ধ করুন</button>
        `;
        document.getElementById('l-modal').style.display = 'flex';
    }

    function saveLTrans(phone) {
        const desc = document.getElementById('ntDesc').value;
        const bill = document.getElementById('ntBill').value || 0;
        const paid = document.getElementById('ntPaid').value || 0;
        const date = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
        l_transactions.push({phone, desc, bill, paid, date});
        localStorage.setItem('transactions', JSON.stringify(l_transactions));
        openLDetails(phone);
        updateLedgerDash();
    }

    function closeLModal() { document.getElementById('l-modal').style.display = 'none'; }
    
    function sendLWA(phone) {
        const c = l_customers.find(x => x.phone === phone);
        const d = calculateLDue(phone);
        const msg = `প্রিয় ${c.name}, স্মার্ট কম্পিউটার থেকে আপনার বকেয়া ৳${d.balance} পরিশোধের জন্য অনুরোধ করা হচ্ছে। ধন্যবাদ।`;
        window.open(`https://wa.me/88${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function printLInvoice(phone) {
        const cust = l_customers.find(c => c.phone === phone);
        const d = calculateLDue(phone);
        const win = window.open('', '_blank');
        win.document.write(`<html><body><h1 style="text-align:center">SMART COMPUTER</h1><p>Customer: ${cust.name}</p><h2>Total Due: ৳${d.balance}</h2><script>window.print()<\/script></body></html>`);
        win.document.close();
    }

    function openQuickEntry() {
        document.getElementById('l-modal-body').innerHTML = `
            <h3>নতুন এন্ট্রি</h3>
            <input type="text" id="qName" placeholder="নাম" style="width:100%; padding:10px; margin-bottom:10px">
            <input type="text" id="qPhone" placeholder="মোবাইল" style="width:100%; padding:10px; margin-bottom:10px">
            <input type="number" id="qBill" placeholder="বাকির পরিমাণ" style="width:100%; padding:10px; margin-bottom:10px">
            <button onclick="saveQuickL()" style="width:100%; background:#e67e22; color:white; border:none; padding:10px">Save Entry</button>
            <button onclick="closeLModal()" style="width:100%; margin-top:5px">Cancel</button>
        `;
        document.getElementById('l-modal').style.display = 'flex';
    }

    function saveQuickL() {
        const n = document.getElementById('qName').value;
        const p = document.getElementById('qPhone').value;
        const b = document.getElementById('qBill').value;
        if(!n || !p) return alert("তথ্য দিন");
        if(!l_customers.find(c => c.phone === p)) l_customers.push({name:n, phone:p});
        l_transactions.push({phone:p, desc:'নতুন এন্ট্রি', bill:b, paid:0, date: new Date().toLocaleDateString('en-GB').replace(/\//g, '-')});
        localStorage.setItem('customers', JSON.stringify(l_customers));
        localStorage.setItem('transactions', JSON.stringify(l_transactions));
        closeLModal(); updateLedgerDash();
    }
</script>

</body>
</html>
